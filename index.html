<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista con viñetas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.6;
        }
        h1 {
            color: #333;
        }
        ul {
            padding-left: 1.5rem;
        }
        li {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <h1>Mi lista con viñetas</h1>
    <p>Este es un texto introductorio antes de la lista:</p>
    
    <ul>
        <li>Primer elemento de la lista</li>
        <li>Segundo elemento con más detalle</li>
        <li>Tercer elemento importante</li>
        <li>Cuarto elemento adicional</li>
        <li>Quinto y último elemento</li>
    </ul>
    
    <p>Y este es un texto después de la lista.</p>
</body>
</html>
